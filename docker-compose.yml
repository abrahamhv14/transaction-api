version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transactions_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Apunta a tu mock del proveedor (WireMock, stub, etc.). Ajusta según
      # cómo lo levantes localmente, ej. host.docker.internal en Docker Desktop.
      PROVIDER_BASE_URL: http://host.docker.internal:9090
    ports:
      - "8080:8080"

volumes:
  pgdata:
