spring:
  application:
    name: transaction-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: 8080

# URL y timeouts del proveedor externo (mockeado con WireMock/stub configurable).
provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:9090}
  connect-timeout-ms: 1000
  read-timeout-ms: 2000

resilience4j:
  retry:
    instances:
      providerClient:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Los rechazos de negocio NO se reintentan: el proveedor ya respondió
        # con una decisión válida (ej. fondos insuficientes).
        ignore-exceptions:
          - com.spin.transactionapi.provider.exception.ProviderRejectedException
  circuitbreaker:
    instances:
      providerClient:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        ignore-exceptions:
          - com.spin.transactionapi.provider.exception.ProviderRejectedException

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
